<div class="encabezado">
  <h1>Nueva incidencia</h1>
  <p class="saludo">Describe el problema con el mayor detalle posible</p>
</div>

<div class="tarjeta formulario-tarjeta">
  <div class="banner error" *ngIf="mensajeError()">{{ mensajeError() }}</div>

  <form [formGroup]="formulario" (ngSubmit)="onSubmit()" novalidate class="form-grid">
    <div class="campo full">
      <label for="titulo">Título</label>
      <input
        id="titulo"
        type="text"
        formControlName="titulo_incidencia"
        [class.invalido]="camgit oInvalido('titulo_incidencia')"
        placeholder="Ej. Computadora no enciende en laboratorio 2"
      />
      <p class="error-texto" *ngIf="campoInvalido('titulo_incidencia')">
        El título debe tener entre 5 y 100 caracteres
      </p>
    </div>

    <div class="campo">
      <label for="categoria">Categoría</label>
      <select id="categoria" formControlName="id_categoria" [class.invalido]="campoInvalido('id_categoria')">
        <option [ngValue]="null" disabled>Selecciona una categoría</option>
        <option *ngFor="let c of categorias()" [ngValue]="c.id_categoria">{{ c.nombre_categoria }}</option>
      </select>
      <p class="error-texto" *ngIf="campoInvalido('id_categoria')">Selecciona una categoría</p>
    </div>

    <div class="campo">
      <label for="ubicacion">Ubicación</label>
      <select id="ubicacion" formControlName="id_ubicacion" [class.invalido]="campoInvalido('id_ubicacion')">
        <option [ngValue]="null" disabled>Selecciona una ubicación</option>
        <option *ngFor="let u of ubicaciones()" [ngValue]="u.id_ubicacion">
          {{ u.nombre_ubicacion }}
        </option>
      </select>
      <p class="error-texto" *ngIf="campoInvalido('id_ubicacion')">Selecciona una ubicación</p>
    </div>

    <div class="campo">
      <label for="prioridad">Prioridad</label>
      <select id="prioridad" formControlName="id_prioridad" [class.invalido]="campoInvalido('id_prioridad')">
        <option [ngValue]="null" disabled>Selecciona una prioridad</option>
        <option *ngFor="let p of prioridades()" [ngValue]="p.id_prioridad">
          {{ p.nombre_prioridad | prioridadLegible }}
        </option>
      </select>
      <p class="error-texto" *ngIf="campoInvalido('id_prioridad')">Selecciona una prioridad</p>
    </div>

    <div class="campo full">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        rows="5"
        formControlName="descripcion_incidencia"
        [class.invalido]="campoInvalido('descripcion_incidencia')"
        placeholder="Describe el problema: qué ocurre, desde cuándo y cualquier detalle relevante"
      ></textarea>
      <p class="error-texto" *ngIf="campoInvalido('descripcion_incidencia')">
        La descripción debe tener al menos 10 caracteres
      </p>
    </div>

    <div class="campo full acciones">
      <a routerLink="/incidencias" class="btn btn-outline">Cancelar</a>
      <button type="submit" class="btn" [disabled]="enviando()">
        {{ enviando() ? 'Registrando...' : 'Registrar incidencia' }}
      </button>
    </div>
  </form>
</div>
