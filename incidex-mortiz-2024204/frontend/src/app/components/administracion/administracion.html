<div class="encabezado">
  <h1>Administración</h1>
  <p class="saludo">Gestiona usuarios y catálogos del sistema</p>
</div>

<div class="pestanas">
  <button
    *ngFor="let p of pestanas"
    [class.activa]="pestanaActiva() === p.clave"
    (click)="cambiarPestana(p.clave)"
  >
    {{ p.etiqueta }}
  </button>
</div>

<div class="tarjeta">
  <app-usuarios-tab *ngIf="pestanaActiva() === 'usuarios'" />
  <app-departamentos-tab *ngIf="pestanaActiva() === 'departamentos'" />
  <app-categorias-tab *ngIf="pestanaActiva() === 'categorias'" />
  <app-ubicaciones-tab *ngIf="pestanaActiva() === 'ubicaciones'" />
  <app-prioridades-tab *ngIf="pestanaActiva() === 'prioridades'" />
</div>
